<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ひとことメッセージ</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
    }

    .description {
      text-align: center;
      color: #777;
    }

    form {
      display: flex;
      gap: 10px;
      margin: 30px 0;
    }

    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      cursor: pointer;
    }

    #status {
      text-align: center;
      min-height: 24px;
    }

    .message {
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .date {
      margin-top: 5px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <h1>ひとことメッセージ</h1>

  <p class="description">
    20文字以内でメッセージを送ろう
  </p>

  <form id="messageForm">

    <input
      id="messageInput"
      type="text"
      maxlength="20"
      placeholder="メッセージを入力"
      required
    >

    <button type="submit">
      送信
    </button>

  </form>

  <p id="status"></p>

  <h2>みんなのメッセージ</h2>

  <div id="messageList">
    読み込み中...
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://lhitpvrxndtlzdehlodh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Jf6Z3C05keTiw9SbnJkEvw_agyQ7LYj";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById("messageForm");

    const input =
      document.getElementById("messageInput");

    const messageList =
      document.getElementById("messageList");

    const status =
      document.getElementById("status");


    // メッセージ一覧を取得
    async function loadMessages() {

      const { data, error } =
        await supabaseClient
          .from("message")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(error);

        messageList.textContent =
          "メッセージを読み込めませんでした。";

        return;
      }


      messageList.innerHTML = "";


      data.forEach(row => {

        const box =
          document.createElement("div");

        box.className = "message";


        const text =
          document.createElement("div");

        text.textContent =
          row.message;


        const date =
          document.createElement("div");

        date.className = "date";

        date.textContent =
          new Date(
            row.created_at
          ).toLocaleString("ja-JP");


        box.appendChild(text);

        box.appendChild(date);

        messageList.appendChild(box);

      });

    }


    // メッセージ送信
    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const message =
          input.value.trim();


        if (!message) {
          return;
        }


        if (message.length > 20) {

          status.textContent =
            "20文字以内で入力してください。";

          return;
        }


        status.textContent =
          "送信中...";


        const { error } =
          await supabaseClient
            .from("message")
            .insert({
              message: message
            });


        if (error) {

          console.error(error);

          status.textContent =
            "送信に失敗しました。";

          return;
        }


        input.value = "";

        status.textContent =
          "送信しました！";


        await loadMessages();

      }
    );


    // 最初に一覧を読み込む
    loadMessages();

  </script>

</body>
</html>
