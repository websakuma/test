<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ひとことメッセージ</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
    }

    .description {
      text-align: center;
      color: #777;
    }

    form {
      margin: 30px 0;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .time-label {
      display: block;
      margin: 5px 0 8px;
      font-size: 14px;
      text-align: center;
    }

    .time-inputs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 15px;
    }

    .time-inputs input {
      width: 90px;
      margin-bottom: 0;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
    }

    #status {
      text-align: center;
      min-height: 24px;
    }

    .message {
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .name {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .date {
      margin-top: 5px;
      font-size: 12px;
      color: #888;
    }

    .expires {
      margin-top: 4px;
      font-size: 12px;
      color: #888;
    }

    .like-area {
      margin-top: 12px;
    }
    
    .like-button {
      width: auto;
      padding: 6px 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }
    
    .like-button:hover {
      background: #f5f5f5;
    }
    
  </style>
</head>

<body>

  <h1>ひとことメッセージ</h1>

  <p class="description">
    20文字以内でメッセージを送ろう。<br>
    投稿の表示時間は最大24時間です。
  </p>

  <form id="messageForm">

    <input
      id="nameInput"
      type="text"
      maxlength="10"
      placeholder="名前（10文字以内）"
      required
    >

    <input
      id="messageInput"
      type="text"
      maxlength="20"
      placeholder="メッセージ（20文字以内）"
      required
    >

    <label class="time-label">
      表示時間
    </label>

    <div class="time-inputs">

      <input
        id="hoursInput"
        type="number"
        min="0"
        max="24"
        value="1"
        inputmode="numeric"
        aria-label="表示時間"
      >
      <span>時間</span>

      <input
        id="minutesInput"
        type="number"
        min="0"
        max="59"
        value="0"
        inputmode="numeric"
        aria-label="表示分"
      >
      <span>分</span>

    </div>

    <button type="submit">
      送信
    </button>

  </form>

  <p id="status"></p>

  <h2>みんなのメッセージ</h2>

  <div id="messageList">
    読み込み中...
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://lhitpvrxndtlzdehlodh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Jf6Z3C05keTiw9SbnJkEvw_agyQ7LYj";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById("messageForm");

    const nameInput =
      document.getElementById("nameInput");

    const messageInput =
      document.getElementById("messageInput");

    const hoursInput =
      document.getElementById("hoursInput");

    const minutesInput =
      document.getElementById("minutesInput");

    const messageList =
      document.getElementById("messageList");

    const status =
      document.getElementById("status");


    // メッセージ一覧を取得
    async function loadMessages() {

      const now =
        new Date().toISOString();


      const { data, error } =
        await supabaseClient
          .from("message")
          .select("*")
          .gt("expires_at", now)
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(error);

        messageList.textContent =
          "メッセージを読み込めませんでした。";

        return;
      }


      messageList.innerHTML = "";


      if (data.length === 0) {

        messageList.textContent =
          "まだメッセージはありません。";

        return;
      }


      data.forEach(row => {

        const box =
          document.createElement("div");

        box.className = "message";


        const name =
          document.createElement("div");

        name.className = "name";

        name.textContent =
          row.name || "名無し";


        const text =
          document.createElement("div");

        text.textContent =
          row.message;


        const date =
          document.createElement("div");

        date.className = "date";

        date.textContent =
          "投稿：" +
          new Date(
            row.created_at
          ).toLocaleString("ja-JP");


        const expires =
          document.createElement("div");

        expires.className = "expires";


        const remainingMs =
          new Date(row.expires_at).getTime()
          - Date.now();

        const remainingMinutes =
          Math.max(
            0,
            Math.ceil(
              remainingMs / 1000 / 60
            )
          );


        const remainingHours =
          Math.floor(
            remainingMinutes / 60
          );

        const minutes =
          remainingMinutes % 60;


        if (remainingHours > 0) {

          expires.textContent =
            `あと約${remainingHours}時間${minutes}分で消えます`;

        } else {

          expires.textContent =
            `あと約${minutes}分で消えます`;

        }


// いいねエリア
const likeArea =
  document.createElement("div");

likeArea.className = "like-area";


const likeButton =
  document.createElement("button");

likeButton.type = "button";
likeButton.className = "like-button";


// この投稿にいいね済みか確認
const likeKey =
  `liked_message_${row.id}`;

const alreadyLiked =
  localStorage.getItem(likeKey) === "true";


function updateLikeButton() {

  likeButton.textContent =
    `👍 ${row.likes ?? 0}`;

  if (
    localStorage.getItem(likeKey) === "true"
  ) {

    likeButton.disabled = true;
  }

}


updateLikeButton();


// いいねボタンを押したとき
likeButton.addEventListener(
  "click",
  async () => {

    // すでに押していたら何もしない
    if (
      localStorage.getItem(likeKey) === "true"
    ) {
      return;
    }


    likeButton.disabled = true;


    const currentLikes =
      row.likes ?? 0;

    const newLikes =
      currentLikes + 1;


    const { error } =
      await supabaseClient
        .from("message")
        .update({
          likes: newLikes
        })
        .eq("id", row.id);


    if (error) {

      console.error(error);

      likeButton.disabled = false;

      return;
    }


    // いいね済みとしてブラウザに保存
    localStorage.setItem(
      likeKey,
      "true"
    );


    row.likes = newLikes;

    updateLikeButton();

  }
);


likeArea.appendChild(likeButton);


box.appendChild(name);
box.appendChild(text);
box.appendChild(likeArea);
box.appendChild(date);
box.appendChild(expires);

messageList.appendChild(box);
      });

    }


    // メッセージ送信
    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const name =
          nameInput.value.trim();

        const message =
          messageInput.value.trim();

        const hours =
          Number(hoursInput.value);

        const minutes =
          Number(minutesInput.value);


        if (!name || !message) {
          return;
        }


        if (name.length > 10) {

          status.textContent =
            "名前は10文字以内で入力してください。";

          return;
        }


        if (message.length > 20) {

          status.textContent =
            "メッセージは20文字以内で入力してください。";

          return;
        }


        if (
          !Number.isInteger(hours) ||
          !Number.isInteger(minutes) ||
          hours < 0 ||
          hours > 24 ||
          minutes < 0 ||
          minutes > 59
        ) {

          status.textContent =
            "表示時間を正しく入力してください。";

          return;
        }


        const durationMinutes =
          hours * 60 + minutes;


        if (durationMinutes < 1) {

          status.textContent =
            "表示時間は1分以上にしてください。";

          return;
        }


        if (durationMinutes > 1440) {

          status.textContent =
            "表示時間は24時間以内にしてください。";

          return;
        }


        const expiresAt =
          new Date(
            Date.now()
            + durationMinutes * 60 * 1000
          ).toISOString();


        status.textContent =
          "送信中...";


        const { error } =
          await supabaseClient
            .from("message")
            .insert({
              name: name,
              message: message,
              expires_at: expiresAt
            });


        if (error) {

          console.error(error);

          status.textContent =
            "送信に失敗しました。";

          return;
        }


        messageInput.value = "";

        status.textContent =
          "送信しました！";


        await loadMessages();

      }
    );


    // 最初に一覧を読み込む
    loadMessages();


    // 10秒ごとに一覧を更新
    setInterval(() => {
      loadMessages();
    }, 10000);

  </script>

</body>
</html>
