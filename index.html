<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ひとことメッセージ</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
    }

    .description {
      text-align: center;
      color: #777;
    }

    form {
      margin: 30px 0;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
    }

    #status {
      text-align: center;
      min-height: 24px;
    }

    .message {
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .name {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .date {
      margin-top: 5px;
      font-size: 12px;
      color: #888;
    }

    .expires {
      margin-top: 4px;
      font-size: 12px;
      color: #888;
    }

    .time-label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h1>ひとことメッセージ</h1>

  <p class="description">
    20文字以内でメッセージを送ろう。<br>
    投稿の表示時間は15分〜24時間から選べます。
  </p>

  <form id="messageForm">

    <input
      id="nameInput"
      type="text"
      maxlength="10"
      placeholder="名前（10文字以内）"
      required
    >

    <input
      id="messageInput"
      type="text"
      maxlength="20"
      placeholder="メッセージ（20文字以内）"
      required
    >

    <label class="time-label" for="durationSelect">
      表示時間
    </label>

    <select id="durationSelect"></select>

    <button type="submit">
      送信
    </button>

  </form>

  <p id="status"></p>

  <h2>みんなのメッセージ</h2>

  <div id="messageList">
    読み込み中...
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://lhitpvrxndtlzdehlodh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Jf6Z3C05keTiw9SbnJkEvw_agyQ7LYj";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById("messageForm");

    const nameInput =
      document.getElementById("nameInput");

    const messageInput =
      document.getElementById("messageInput");

    const durationSelect =
      document.getElementById("durationSelect");

    const messageList =
      document.getElementById("messageList");

    const status =
      document.getElementById("status");


    // 15分刻みで最大24時間まで選択肢を作る
    for (let minutes = 15; minutes <= 1440; minutes += 15) {

      const option =
        document.createElement("option");

      option.value = minutes;

      const hours =
        Math.floor(minutes / 60);

      const remainingMinutes =
        minutes % 60;


      if (hours === 0) {

        option.textContent =
          `${remainingMinutes}分`;

      } else if (remainingMinutes === 0) {

        option.textContent =
          `${hours}時間`;

      } else {

        option.textContent =
          `${hours}時間${remainingMinutes}分`;

      }


      durationSelect.appendChild(option);

    }


    // 初期値を1時間にする
    durationSelect.value = "60";


    // メッセージ一覧を取得
    async function loadMessages() {

      const now =
        new Date().toISOString();


      const { data, error } =
        await supabaseClient
          .from("message")
          .select("*")
          .gt("expires_at", now)
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(error);

        messageList.textContent =
          "メッセージを読み込めませんでした。";

        return;
      }


      messageList.innerHTML = "";


      if (data.length === 0) {

        messageList.textContent =
          "まだメッセージはありません。";

        return;
      }


      data.forEach(row => {

        const box =
          document.createElement("div");

        box.className = "message";


        // 名前
        const name =
          document.createElement("div");

        name.className = "name";

        name.textContent =
          row.name || "名無し";


        // メッセージ
        const text =
          document.createElement("div");

        text.textContent =
          row.message;


        // 投稿日時
        const date =
          document.createElement("div");

        date.className = "date";

        date.textContent =
          "投稿：" +
          new Date(
            row.created_at
          ).toLocaleString("ja-JP");


        // 残り時間
        const expires =
          document.createElement("div");

        expires.className = "expires";


        const remainingMs =
          new Date(row.expires_at).getTime()
          - Date.now();

        const remainingMinutes =
          Math.max(
            0,
            Math.ceil(
              remainingMs / 1000 / 60
            )
          );


        if (remainingMinutes >= 60) {

          const hours =
            Math.floor(
              remainingMinutes / 60
            );

          const minutes =
            remainingMinutes % 60;


          if (minutes === 0) {

            expires.textContent =
              `あと約${hours}時間で消えます`;

          } else {

            expires.textContent =
              `あと約${hours}時間${minutes}分で消えます`;

          }

        } else {

          expires.textContent =
            `あと約${remainingMinutes}分で消えます`;

        }


        box.appendChild(name);
        box.appendChild(text);
        box.appendChild(date);
        box.appendChild(expires);

        messageList.appendChild(box);

      });

    }


    // メッセージ送信
    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const name =
          nameInput.value.trim();

        const message =
          messageInput.value.trim();

        const durationMinutes =
          Number(durationSelect.value);


        if (!name || !message) {
          return;
        }


        if (name.length > 10) {

          status.textContent =
            "名前は10文字以内で入力してください。";

          return;
        }


        if (message.length > 20) {

          status.textContent =
            "メッセージは20文字以内で入力してください。";

          return;
        }


        if (
          durationMinutes < 15 ||
          durationMinutes > 1440 ||
          durationMinutes % 15 !== 0
        ) {

          status.textContent =
            "表示時間が正しくありません。";

          return;
        }


        // 現在時刻＋選択した時間
        const expiresAt =
          new Date(
            Date.now()
            + durationMinutes * 60 * 1000
          ).toISOString();


        status.textContent =
          "送信中...";


        const { error } =
          await supabaseClient
            .from("message")
            .insert({
              name: name,
              message: message,
              expires_at: expiresAt
            });


        if (error) {

          console.error(error);

          status.textContent =
            "送信に失敗しました。";

          return;
        }


        messageInput.value = "";

        status.textContent =
          "送信しました！";


        await loadMessages();

      }
    );


    // 最初に一覧を読み込む
    loadMessages();


    // 10秒ごとに一覧を更新
    setInterval(() => {
      loadMessages();
    }, 10000);

  </script>

</body>
</html>
