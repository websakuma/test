<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ひとことメッセージ</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h1 {
      text-align: center;
    }

    .description {
      text-align: center;
      color: #777;
    }

    form {
      margin: 30px 0;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
    }

    #status {
      text-align: center;
      min-height: 24px;
    }

    .message {
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .name {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .date {
      margin-top: 5px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <h1>ひとことメッセージ</h1>

  <p class="description">
    20文字以内でメッセージを送ろう。<br>
    投稿は1分後に消えます。
  </p>

  <form id="messageForm">

    <input
      id="nameInput"
      type="text"
      maxlength="10"
      placeholder="名前（10文字以内）"
      required
    >

    <input
      id="messageInput"
      type="text"
      maxlength="20"
      placeholder="メッセージ（20文字以内）"
      required
    >

    <button type="submit">
      送信
    </button>

  </form>

  <p id="status"></p>

  <h2>みんなのメッセージ</h2>

  <div id="messageList">
    読み込み中...
  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://lhitpvrxndtlzdehlodh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Jf6Z3C05keTiw9SbnJkEvw_agyQ7LYj";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const form =
      document.getElementById("messageForm");

    const nameInput =
      document.getElementById("nameInput");

    const messageInput =
      document.getElementById("messageInput");

    const messageList =
      document.getElementById("messageList");

    const status =
      document.getElementById("status");


    // メッセージ一覧を取得
    async function loadMessages() {

      const oneMinuteAgo =
        new Date(Date.now() - 60 * 1000).toISOString();

      const { data, error } =
        await supabaseClient
          .from("message")
          .select("*")
          .gte("created_at", oneMinuteAgo)
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(error);

        messageList.textContent =
          "メッセージを読み込めませんでした。";

        return;
      }


      messageList.innerHTML = "";


      if (data.length === 0) {

        messageList.textContent =
          "まだメッセージはありません。";

        return;
      }


      data.forEach(row => {

        const box =
          document.createElement("div");

        box.className = "message";


        // 名前
        const name =
          document.createElement("div");

        name.className = "name";

        name.textContent =
          row.name || "名無し";


        // メッセージ
        const text =
          document.createElement("div");

        text.textContent =
          row.message;


        // 投稿日時
        const date =
          document.createElement("div");

        date.className = "date";

        date.textContent =
          new Date(
            row.created_at
          ).toLocaleString("ja-JP");


        box.appendChild(name);
        box.appendChild(text);
        box.appendChild(date);

        messageList.appendChild(box);

      });

    }


    // メッセージ送信
    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const name =
          nameInput.value.trim();

        const message =
          messageInput.value.trim();


        if (!name || !message) {
          return;
        }


        if (name.length > 10) {

          status.textContent =
            "名前は10文字以内で入力してください。";

          return;
        }


        if (message.length > 20) {

          status.textContent =
            "メッセージは20文字以内で入力してください。";

          return;
        }


        status.textContent =
          "送信中...";


        const { error } =
          await supabaseClient
            .from("message")
            .insert({
              name: name,
              message: message
            });


        if (error) {

          console.error(error);

          status.textContent =
            "送信に失敗しました。";

          return;
        }


        messageInput.value = "";

        status.textContent =
          "送信しました！";


        await loadMessages();

      }
    );


    // 最初に一覧を読み込む
    loadMessages();


    // 1秒ごとにメッセージ一覧を更新
    setInterval(() => {
      loadMessages();
    }, 1000);

  </script>

</body>
</html>
